[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "radioskysims-skymap"
version = "0.1.0"
description = "SkyMap do RadioSkySim: domínio (SkyMap/NSide), análise, geração, repositório HDF5 e providers (healpy/pysm/HIPS)."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
authors = [
  { name = "Luciano Barosi", email = "lbarosi@df.ufcg.edu.br" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.3",
  "astropy>=7.1",
  "xarray>=2022.3.1",
  "healpy>=1.17",
  "h5py>=3.10",
  "pysm3>=3.4",
  "radioskysims-core",
]

[project.urls]
Homepage = "https://github.com/barosil/RadioSkySim"
"Bug Tracker" = "https://github.com/barosil/RadioSkySim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/radioskysims_skymap"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
testpaths = ["tests"]
